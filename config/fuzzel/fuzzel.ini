# ─── Nyri · fuzzel ───────────────────────────────────────────────────────────
# Stand-in launcher until the shell gets its own M3 search surface.
include=~/nyri/config/fuzzel/colors.ini

[main]
font=Rubik:size=13
prompt="  "
icon-theme=Papirus-Dark
terminal=kitty -e
layer=overlay
width=36
lines=8
horizontal-pad=24
vertical-pad=20
inner-pad=12
line-height=34
image-size-ratio=0.5

[border]
width=0
radius=28
selection-radius=28
